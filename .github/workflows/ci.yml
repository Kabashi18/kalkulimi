name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalo varësitë
        run: npm ci

      - name: Kopjet web/mobil janë të sinkronizuara
        working-directory: .
        run: node scripts/check-shared-copies.mjs

      - name: Testet e logjikës (Vitest)
        run: npm test

      - name: Build
        run: npm run build
