version: '3.8'

services:
  # Shërbimi 1: Backend API & Frontend SPA
  kalkulimi-app:
    build: .
    container_name: kalkulimi_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=sekreti_shume_i_sigurt_kalkulimi_jwt_token_2026
      - DATABASE_URL=mysql://kalkulimi_user:kalkulimi_pass@mysql-db:3306/expense_tracker_db
    depends_on:
      mysql-db:
        condition: service_healthy

  # Shërbimi 2: MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: kalkulimi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: expense_tracker_db
      MYSQL_USER: kalkulimi_user
      MYSQL_PASSWORD: kalkulimi_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
